# VideoWorkbench 配置
#
# 默认位置：~/.video-workbench/config.yaml（Workbench 自己的家）。
# 这份**不是** bili-scribe 的配置：两边互不影响，改这里不会动到 bili-scribe，
# 反过来它也不会改到你的模型/角色设置。第一次启动时若旧家
# (~/.bili-scribe/config.yaml + workbench.json) 还在，会被**只读**搬运一次到新家
# —— 搬运逐字段忠实（不改任何值），旧家之后只读，连 .bak 都不再产生。
#
# 本文件由设置页面生成。手动修改同样生效；下次在页面上保存时整体覆盖，
# 覆盖前会备份为 config.yaml.bak。
#
# 路径字段支持 ~ 与 %APPDATA% 这类环境变量，读入时统一展开为绝对路径。

app:
  language: "zh-CN"
  # 媒体交给界面播放的方式：auto=按体积和编码自动挑 / file=file:// / http=本地 HTTP。
  media_server: "auto"

ui:
  # 界面皮肤：ark（深色，默认）/ exhibition（浅色）。只影响配色，不影响处理逻辑。
  skin: "exhibition"
  rail_collapsed: false
  # 首次启动向导看过没有（跳过一次也算看过，不会每次启动都弹）。
  onboarded: false

server:
  # 仅调试模式（python run.py --web）使用。桌面模式不起 HTTP 服务。
  host: "127.0.0.1"
  port: 8818

llm:
  base_url: "https://api.deepseek.com/v1"
  api_key: ""
  model: "deepseek-chat"
  temperature: 0.3
  max_tokens: 32768
  # 思考模型（Qwen3 系列、QwQ、带 -thinking 的型号等）先产出一大段推理再作答。
  # 这段推理算不算进 max_tokens，因端点而异，判据看报错本身：本机 workbuddy/magpie
  # 实测**算**——预算被打满时 finish_reason=length、正文返回空、usage 里 reasoning_tokens
  # 正好等于 max_tokens。所以正文空先看 finish_reason 和思考 token 数，别无脑抬这个值。
  # auto=不发相关参数 / off=显式发 enable_thinking:false / on=显式发 true。
  # 别指望「空正文会自动关思考重试」：Workbench 这条路没有那条腿，而且这个端点连
  # enable_thinking:false 都不遵守（实测关掉仍烧 140 思考 tokens），关掉不是根治。
  thinking: "auto"
  # 单次请求的读超时（秒）。思考模型的耗时主要花在推理上，调大它只是缓解。
  timeout_seconds: 300
  # 调用模型时走的代理。留空 = 直连，且不读 HTTP_PROXY/HTTPS_PROXY。
  proxy: ""
  # 总结角色：这份模板**不复制角色名单**——名单的唯一出处是程序里的 ROLE_KEYS
  # （core/summary/__init__.py），界面下拉与 `--roles` 都读它。写死在这里迟早变成
  # 第二份真源并漂掉（本文件以前列过 8 个键、还写过「shipin 是唯一单轮角色」，
  # 两句在角色合并后都成了假话）。要看当前有哪几个：
  #   .venv/Scripts/python.exe -m video_workbench.cli roles
  # 全部在用角色都走三轮改写（生成→自我批判→修订），耗时约为单轮的 3 倍；
  # 「单轮角色」那一档已随 shipin 一起退役，现在没有更快的档。
  # 已停用的键（standard / xueshu / shipin）仍能在历史版本里读到，导出与界面会标
  # 「（已停用）」；但照抄进这个 role 字段会被拒——所以这里给一个在用的键。
  role: "wengao"
  # 附加提示词：把 resources/prompts/大概率管用 .txt 的**全文**接在当前角色的 txt 真源之后、
  # 输出契约之前（顺序固定：txt → extra → 契约；契约必须在最后，它专门压住 txt 里
  # 「必须打印阶段 1/2/3」「输出 ReAct 执行日志」那类指令，否则 JSON 解析当场坏掉）。
  # 默认关。那篇是对抗性双角色提示词（要求 [lbk]Guardian[rbk] / [lbk]Maverick[rbk] 两段必出），
  # 和总结要的 JSON 契约正面冲突，默认开着会拖垮产出——要不要吃它交给人。
  # 按请求生效（contextvar）：并发跑的两个任务一个开一个关时各自的提示词都正确，不用重启。
  # 拼接规则与缺文件的回落只有一个出处：core/prompt_source.py。
  # 存盘位置：这个键 bili-scribe 不认识，所以它只落在同目录的 workbench.json 里，
  # 共用的 config.yaml 不会被写进 WB 专有键（实测 render_yaml 不输出它）。
  extra_prompt: false
  # 坏 JSON 抢救：**默认关**，等于今天的对账档行为（模型输出不是合法 JSON 就报错，
  # 不修复、不续写、不分两次要、不严格重问）。打开后只放行「修 JSON」那几步，
  # 输出预算不跟着抬——这是它与下面那个环境变量的唯一区别。
  # 界面上有开关（设置 → 模型 → 高级 → 坏 JSON 抢救），下一次请求就生效，不用重启
  # （每次调用现读，不缓存到 import）。抢救失败就停手，不会反复重试烧钱。
  # 存盘位置同 extra_prompt：bili-scribe 不认识这个键，只落在 workbench.json。
  rescue_json: false
  # 总结的对账模式：**默认开**，不是配置项，是环境变量，所以这里只写说明。
  # 开着时每次模型调用只发一次请求、坏 JSON 不抢救（不修复、不续写、不分两次要、
  # 不严格重问）、输出预算不抬升（照 max_tokens 原样给），也就是与 bili_scribe 那份
  # 方法论逐请求一致——两边的输出可以逐字段比对，副本也受逐字节锁保护。
  # 代价是实测过的：同一份日志里「已按更严格的要求重问一次」命中 7 次、「输出被截断了，
  # 正在接着写」5 次，长素材的坏 JSON 是真会发生。这些场景在默认档下直接失败，
  # 报错末尾会把开关念出来。
  # 需要「抢救阶梯 + 预算抬升（12288 起、翻倍、封 16384）」两件事一起放行时，设
  # WB_SUMMARY_PARITY_STRICT=0（false/off 同义），改完重启生效；只要抢救、不要动预算
  # 就用上面的 rescue_json（设置页里那个开关走的就是它）。
  # 保留项：时间线补密不受这个开关影响——有密时间线就覆盖 bs 的「最多 20 条」上限。
  # 实测你手上 86 个历史版本的落库 timeline 条数是 p50=8 / p90=12 / 最多 19，
  # 也就是说这条上限目前咬不到，保留它是保住能力，不是保住现在的差异。
  max_input_chars: 24000
  chunk_size: 6000
  chunk_overlap: 400
  # 分任务模型，留空回退 model。
  tasks:
    summary: ""
    collection_overview: ""
    translate: ""
    clip_analyze: ""
    copy: ""
    refine: ""
    vision: ""

storage:
  db_path: "C:\\Users\\b1596\\.bili-scribe\\bili-scribe.db"
  # 分段预读笔记的磁盘缓存（长素材第一次总结时逐段提炼，之后同一份素材直接复用，
  # 不再重跑那轮最贵的预读）。位置由 db_path 同级的 notes-cache/ 推导，不用单独配：
  # 写这一段只是告诉你它在存东西——以前这目录根本没人用。
  # 缓存坏了不影响正确性：读不出就按未命中重跑，写失败只记日志；随时可以整个删掉，
  # 下一次总结自己会把预读再跑一遍，产物一分不差（界面上走 summary.notes.clear，
  # 返回 {"removed": 条数}；现状走 summary.notes.stats）。
  # 凭据加密密钥，与 bili-scribe 共用。
  key_path: "C:\\Users\\b1596\\.bili-scribe\\key.bin"
  media_root: "%APPDATA%/VideoWorkbench/media"
  cache_root: "%APPDATA%/VideoWorkbench/cache"
  models_root: "%APPDATA%/VideoWorkbench/models"
  ffmpeg_dir: "%APPDATA%/VideoWorkbench/bin"
  # 保留天数。0 = 不自动清理。
  retention:
    source_days: 30
    audio_days: 3
    frames_days: 7
    subtitle_days: 0
    export_days: 0

collect:
  prefer_subtitle_lang: ["zh-CN", "zh-Hans", "zh-Hant", "ai-zh"]
  include_platform_summary: true
  danmaku:
    enabled: true
    also_with_subtitle: false
    max_items: 800
    hot_items: 200
    sample_items: 200
  frames:
    enabled: true
    max_frames: 12
    quality: 85

download:
  quality: "1080p"
  codec: "h264"
  concurrency: 2
  # 复用 bili-scribe 已登录的凭据，不用二次扫码。
  cookies_from: "bili_scribe"
  # 空段自动省略；单稿件时 page_title 为空。
  dir_template: "{up}/{collection}/{title}/{page_title}"

transcribe:
  engine: "faster-whisper"
  model: "large-v3-turbo"
  device: "auto"
  compute_type: "auto"
  language: "auto"
  vad: true
  word_timestamps: true

subtitle:
  default_style: "default"
  optimize: true
  translate:
    target: "auto"
    bilingual: true
    layout: "original_top"
    glossary: []

clip:
  highlight_min_seconds: 15
  highlight_max_seconds: 90
  segment_min_seconds: 120
  segment_max_seconds: 480
  candidate_count: 12
  snap_tolerance_ms: 2000
  vertical_mode: "center"

publish:
  require_confirm: true
  min_interval_seconds: 60
  # 摘要字段已下线（2026-11-07）：笔记不再带摘要，这个键只为兼容老配置保留
  max_summary_chars: 400
  max_comment_chars: 900
  disclose_ai: true
  disclosure_text: "（本总结由 AI 依据视频字幕／弹幕生成）"
  auto_comment: true
