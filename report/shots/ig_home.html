<script>document.documentElement.classList.add("fl-js");</script>    <!-- Force Light Mode: CSS -->
    <style id="force-light-mode">
      :root { color-scheme: light !important; }

      /* 强制基础背景与文字颜色（根据需要可调整） */
      html, body {
        background-color: #ffffff !important;
        color: #111111 !important;
      }

      /* 覆盖常见的深色选择器 / 主题开关 */
      [data-theme="dark"],
      .dark,
      .dark-mode,
      body.dark,
      html.dark {
        background: inherit !important;
        color: inherit !important;
      }

      /* 防止媒体或 svg 被反色 */
      img, picture, video, svg {
        filter: none !important;
        background-color: transparent !important;
      }

      /* 如果主题使用 CSS 变量定义暗色调，这里强制覆盖常用变量（可按需扩充） */
      :root {
        --background-color: #ffffff !important;
        --bg: #ffffff !important;
        --foreground: #111111 !important;
        --text-color: #111111 !important;
        --muted-color: #444444 !important;
      }

      /* 强制覆盖 prefers-color-scheme: dark 的行为 */
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: light !important; }
      }
    </style>

    <!-- Force Light Mode: JS to remove/add intercept dark classes that are added later -->
    <script id="force-light-mode-js">
      (function(){
        try{
          // tell browser to use light scheme
          document.documentElement.style.colorScheme = 'light';
          // remove known dark classes from html/body if present
          document.documentElement.classList.remove('dark');
          document.body.classList.remove('dark','dark-mode');

          // convert data-theme="dark" -> "light"
          document.querySelectorAll('[data-theme]').forEach(function(el){
            if(el.getAttribute('data-theme') === 'dark') el.setAttribute('data-theme', 'light');
          });

          // observe future attribute changes on <html> and <body> to remove 'dark' classes if added later
          var observer = new MutationObserver(function(mutations){
            mutations.forEach(function(m){
              var t = m.target;
              if(t && t.classList){
                if(t.classList.contains('dark') || t.classList.contains('dark-mode')){
                  t.classList.remove('dark','dark-mode');
                }
              }
              if(t && t.getAttribute && t.getAttribute('data-theme') === 'dark'){
                t.setAttribute('data-theme','light');
              }
            });
          });
          observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class','data-theme'] });
          observer.observe(document.body, { attributes: true, attributeFilter: ['class','data-theme'] });
        }catch(e){
          // fail silently
          console && console.debug && console.debug('force-light-mode error', e);
        }
      })();
    </script>

<!-- 3. 交互逻辑：克隆原生菜单 + 展开/收起 -->
<script>
(function() {
    'use strict';

    var fab = document.getElementById('custom-admin-fab');
    var panel = document.getElementById('custom-admin-panel');
    if (!fab || !panel) return;

    // 等待原生 admin bar 渲染完成后克隆菜单内容
    function cloneAdminBar() {
        var original = document.getElementById('wpadminbar');
        if (!original) {
            // 前端未登录或 admin bar 不存在时不执行
            fab.style.display = 'none';
            return false;
        }

        var rootMenu = original.querySelector('#wp-admin-bar-root-default');
        var secondaryMenu = original.querySelector('#wp-admin-bar-top-secondary');

        // 清空面板并注入克隆的菜单
        panel.innerHTML = '';

        if (rootMenu) {
            var rootClone = rootMenu.cloneNode(true);
            rootClone.id = 'custom-admin-root-clone';
            panel.appendChild(rootClone);
        }
        if (secondaryMenu) {
            var secClone = secondaryMenu.cloneNode(true);
            secClone.id = 'custom-admin-secondary-clone';
            panel.appendChild(secClone);
        }

        // 移除克隆节点中带有 id 的原生 admin bar 特有属性，避免冲突
        panel.querySelectorAll('[id^="wp-admin-bar-"]').forEach(function(el) {
            el.removeAttribute('id');
        });

        return true;
    }

    // 尝试克隆，如果 admin bar 尚未渲染则稍后重试
    if (!cloneAdminBar()) {
        var attempts = 0;
        var timer = setInterval(function() {
            attempts++;
            if (cloneAdminBar() || attempts > 20) {
                clearInterval(timer);
            }
        }, 200);
    }

    // 切换面板
    function togglePanel(e) {
        e.stopPropagation();
        var isOpen = panel.classList.contains('open');
        if (isOpen) {
            panel.classList.remove('open');
            fab.classList.remove('active');
        } else {
            panel.classList.add('open');
            fab.classList.add('active');
        }
    }

    fab.addEventListener('click', togglePanel);

    // 点击面板外部关闭
    document.addEventListener('click', function(e) {
        if (panel.classList.contains('open') &&
            !panel.contains(e.target) &&
            e.target !== fab &&
            !fab.contains(e.target)) {
            panel.classList.remove('open');
            fab.classList.remove('active');
        }
    });

    // ESC 关闭
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && panel.classList.contains('open')) {
            panel.classList.remove('open');
            fab.classList.remove('active');
        }
    });

    // 阻止面板内点击冒泡到 document，避免误关
    panel.addEventListener('click', function(e) {
        e.stopPropagation();
    });
})();

    <title>移动端页面跳转动画</title>
    <style>
        /* 移动端页面跳转遮罩层 */
        @media screen and (max-width: 768px) {
            #mobilePageTransition {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: white;
                z-index: 99999;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
            }

            #mobilePageTransition.active {
                opacity: 1;
                visibility: visible;
            }
        }

        /* 非移动端隐藏 */
        @media screen and (min-width: 769px) {
            #mobilePageTransition {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <!-- 移动端页面跳转遮罩层 -->
    <div id="mobilePageTransition"></div>

    <script>
        // 检测是否为移动设备
        function isMobileDevice() {
            return window.innerWidth <= 768 && /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // 移动端页面跳转函数
        function initiateMobileRedirect(url) {
            if (!isMobileDevice()) {
                // 非移动端直接跳转
                window.location.href = url;
                return;
            }

            // 显示过渡遮罩
            const transitionElement = document.getElementById('mobilePageTransition');
            transitionElement.classList.add('active');

            // 延迟执行跳转以显示过渡效果
            setTimeout(function() {
                window.location.href = url;
            }, 400); // 与CSS过渡时间保持一致
        }
    </script>
</body>

<title>融球 · 螺旋扩散 + 毛玻璃音波 · 双螺旋</title>

<!-- 思源黑体（Noto Sans SC） -->

<!-- 引入 anime.js -->

<style>
  :root {
    --yellow-color: #FFDE00;
    --text-color: #000000;
    --bg-color: #FFFFFF;
    --circle-size: 30vh;
    --gray-color: #CCCCCC;
    --white-color: #FFFFFF;
    --background-opacity: 0.35;

    /* 背景点阵参数 */
    --dot-color: 0, 0, 0;          /* 点的 RGB */
    --dot-opacity-min: 0.10;       /* 呼吸最弱时的透明度 */
    --dot-opacity-max: 0.34;       /* 呼吸最强时的透明度 */
  }
  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: var(--bg-color);
    font-family: 'Google Sans Flex', sans-serif;
    overflow: hidden;
  }
  .container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: visible;
  }

  /* ============================================================
     背景图片层
     层级：z-index -6（最底层，铺满整个视口）
     · 完全固定不动（无鼠标视差位移）
     · 与白色遮罩(-5)紧贴，中间不夹层，保证蒙版洞透出的是纯背景图
     ============================================================ */
  .bg-image {
    position: fixed;
    inset: 0;
    z-index: -6;
    background-image: url('https://www.ignoredone.space/wp-content/uploads/2025/02/%E7%BD%91%E9%A1%B5%E9%A6%96%E9%A1%B5%E4%BD%BF%E7%94%A8-scaled-e1756810226577.webp');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #FFFFFF;
    pointer-events: none;
  }

  /* ============================================================
     背景暖光层（与黄色波点发射器交互）
     【方案一】z-index 从 -5 上移到 -4（位于白色遮罩之上）
     ============================================================ */
  .bg-glow {
    position: fixed;
    inset: 0;
    z-index: -4;                 /* 原 -5 → -4 */
    pointer-events: none;
    mix-blend-mode: soft-light;
    opacity: 0.95;
    background:
      radial-gradient(circle 420px at var(--glow-right-x, 75%) var(--glow-right-y, 50%),
        rgba(255, 222, 0, 0.75) 0%,
        rgba(255, 222, 0, 0.35) 38%,
        rgba(255, 222, 0, 0) 72%),
      radial-gradient(circle 340px at var(--glow-left-x, 15%) var(--glow-left-y, 75%),
        rgba(255, 222, 0, 0.65) 0%,
        rgba(255, 222, 0, 0.28) 38%,
        rgba(255, 222, 0, 0) 72%);
    will-change: background;
  }

  /* ============================================================
     Three.js 波浪线画布
     【方案一】z-index 从 -4 上移到 -3
     ============================================================ */
  #waveCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: -3;                 /* 原 -4 → -3 */
    pointer-events: none;
    -webkit-mask-image: radial-gradient(ellipse 85% 75% at 50% 50%, #000 45%, transparent 100%);
            mask-image: radial-gradient(ellipse 85% 75% at 50% 50%, #000 45%, transparent 100%);
  }

  /* ============================================================
     背景：呼吸感浅灰色点阵
     【方案一】z-index 从 -3 上移到 -2（三层共用）
     ============================================================ */
  .dot-matrix-bg {
    position: absolute;
    inset: -12%;
    z-index: -2;                 /* 原 -3 → -2 */
    pointer-events: none;
    background-image: radial-gradient(circle, rgba(var(--dot-color), 0.55) 1.5px, transparent 1.6px);
    background-size: 34px 34px;
    background-position: center center;
    opacity: var(--dot-opacity-min);
    will-change: opacity, transform;
    animation: dotBreatheA 7.5s ease-in-out infinite;
  }
  .dot-matrix-bg.layer-2 {
    background-image: radial-gradient(circle, rgba(var(--dot-color), 0.42) 1.1px, transparent 1.2px);
    background-size: 56px 56px;
    background-position: 17px 17px;
    opacity: var(--dot-opacity-max);
    animation: dotBreatheB 12s ease-in-out infinite;
  }
  .dot-matrix-bg.layer-3 {
    background-image: radial-gradient(circle, rgba(var(--dot-color), 0.30) 0.9px, transparent 1px);
    background-size: 20px 20px;
    background-position: 5px 9px;
    opacity: 0.12;
    animation: dotDrift 26s ease-in-out infinite;
  }

  @keyframes dotBreatheA {
    0%, 100% { opacity: var(--dot-opacity-min); transform: scale(1) translate3d(0, 0, 0); }
    50%      { opacity: var(--dot-opacity-max); transform: scale(1.035) translate3d(0, -0.6%, 0); }
  }
  @keyframes dotBreatheB {
    0%, 100% { opacity: var(--dot-opacity-max); transform: scale(1.03) translate3d(0, 0.5%, 0); }
    50%      { opacity: var(--dot-opacity-min); transform: scale(1) translate3d(0, 0, 0); }
  }
  @keyframes dotDrift {
    0%   { transform: translate3d(0, 0, 0) scale(1); opacity: 0.08; }
    25%  { transform: translate3d(1.2%, -0.8%, 0) scale(1.01); opacity: 0.16; }
    50%  { transform: translate3d(0, -1.4%, 0) scale(1); opacity: 0.10; }
    75%  { transform: translate3d(-1.2%, -0.6%, 0) scale(1.01); opacity: 0.15; }
    100% { transform: translate3d(0, 0, 0) scale(1); opacity: 0.08; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot-matrix-bg,
    .dot-matrix-bg.layer-2,
    .dot-matrix-bg.layer-3 {
      animation: none;
      opacity: 0.16;
      transform: none;
    }
  }

  /* ============================================================
     【方案一核心】遮罩背景（半透明白，压低背景图对比度）
     层级：z-index -5（紧贴背景图 -6 之上）
     · 中间不夹任何氛围层，蒙版洞透出的是纯 .bg-image
     · 氛围层（暖光/波浪线/点阵）全部上移到遮罩之上，
       洞口视觉 = 背景图 + 极淡氛围叠加，仍然以背景图为主体
     ============================================================ */
  .container::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: white;
    opacity: var(--background-opacity);
    z-index: -5;                 /* 原 -1 → -5 */
    pointer-events: none;

    -webkit-mask-image: var(--mask-holes, none);
            mask-image: var(--mask-holes, none);
    -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
    -webkit-mask-composite: source-over;
            mask-composite: add;
  }

  /* ============================================================
     【新增】左上角小字打字机（思源黑体）
     位置：与主标题打字机同一左侧基准线（left: 5%），置于视口左上方
     ============================================================ */
  .subtitle-typewriter {
    position: absolute;
    left: 5%;
    top: 15vh;
    z-index: 3;
    font-family: 'Noto Sans SC', 'Source Han Sans SC', 'Source Han Sans CN',
                 'Source Han Sans', '思源黑体', 'Google Sans Flex', sans-serif;
    font-size: 6px;
    font-weight: 200;
    line-height: 1.5;
    letter-spacing: 1.5em;
    color: rgba(0, 0, 0, 0.4);
    white-space: nowrap;
    pointer-events: none;
    font-feature-settings: 'palt' 1;
    -webkit-font-smoothing: antialiased;
  }
  /* 小字号下的光标覆盖：固定 1px 宽，避免 0.05em 过细 */
  .subtitle-typewriter .cursor {
display: none;
  }
  @media (max-width: 750px) {
    .subtitle-typewriter {
      font-size: 8px;
      letter-spacing: 0.06em;
      top: 5vh;
    }
  }
  @media (max-width: 480px) {
    .subtitle-typewriter { font-size: 9px; }
  }

  /* ============================================================
     主标题区域（打字机）
     ============================================================ */
  .main-text-container {
    position: absolute;
    left: 5%;
    bottom: calc(10vh + 100px);
    z-index: 3;
    line-height: 0.85;
    letter-spacing: -0.05em;
    width: 90%;
  }
  .typewriter-line {
    font-size: 9vw;
    font-weight: 600;
    color: var(--text-color);
    display: block;
    white-space: nowrap;
    overflow: hidden;
    letter-spacing: -0.05em;
  }
  .cursor {
    display: inline-block;
    width: 0.05em;
    height: 0.8em;
    background-color: black;
    vertical-align: middle;
    margin-left: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ============================================================
     液态玻璃悬浮栏
     ============================================================ */
  .glass-bar {
    position: absolute;
    left: 5.5%;
    bottom: 10vh;
    transform: translateX(0);
    width: min(1200px, 85vw);
    height: auto;
    min-height: 44px;
    background: transparent;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    display: flex;
    align-items: center;
    padding: 6px 10px;
    box-sizing: border-box;
    z-index: 100;
    opacity: 0;
  }
  @media (max-width: 750px) {
    .glass-bar { display: none; }
    .main-text-container { bottom: 8vh; }
  }
  .logo {
    width: 15px;
    height: 15px;
    margin-right: 16px;
    margin-left: 6px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; }

  .nav-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: nowrap;
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 4px 0 4px 2px;
    box-sizing: border-box;
  }
  .nav-buttons::-webkit-scrollbar { display: none; }

  .nav-buttons.has-mask {
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
  }
  .nav-buttons.has-mask.no-left {
    -webkit-mask-image: linear-gradient(to right, black 5%, black 95%, transparent 100%);
            mask-image: linear-gradient(to right, black 5%, black 95%, transparent 100%);
  }
  .nav-buttons.has-mask.no-right {
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%);
            mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%);
  }

  .nav-btn {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.32), rgba(255, 255, 255, 0.16));
    backdrop-filter: blur(18px) saturate(170%) brightness(1.03);
    -webkit-backdrop-filter: blur(18px) saturate(170%) brightness(1.03);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 50px;
    padding: 10px 20px;
    color: var(--text-color);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.35s ease,
                backdrop-filter 0.35s ease,
                -webkit-backdrop-filter 0.35s ease,
                border-color 0.35s ease,
                transform 0.3s ease,
                box-shadow 0.35s ease;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    min-width: fit-content;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    will-change: transform, box-shadow, border-color, background, backdrop-filter;
    transform: translateZ(0);
    backface-visibility: hidden;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.75),
      inset 0 -1px 0 rgba(255, 255, 255, 0.15),
      0 2px 6px rgba(0, 0, 0, 0.03);
  }

  .nav-btn:hover {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.28));
    backdrop-filter: blur(30px) saturate(190%) brightness(1.07);
    -webkit-backdrop-filter: blur(30px) saturate(190%) brightness(1.07);
    border-color: rgba(255, 255, 255, 0.78);
    transform: translateY(-2px) scale(1.02);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -1px 0 rgba(255, 255, 255, 0.22),
      0 6px 16px rgba(0, 0, 0, 0.05);
  }

  @media (max-width: 768px) {
    .glass-bar { width: auto; max-width: 90vw; padding: 0 10px; left: 5%; }
    .nav-buttons { gap: 8px; }
    .nav-btn { padding: 8px 15px; font-size: 10px; }
    .logo { margin-right: 20px; }
  }
  @media (max-width: 480px) {
    .glass-bar { left: 5%; width: auto; max-width: 90vw; }
    .nav-buttons { gap: 5px; }
    .nav-btn { padding: 6px 10px; font-size: 8px; }
  }

  /* --- 螺旋扩散黄色圆点容器 + 融球效果 (右侧) --- */
  .spiral-dots-container {
    position: absolute;
    top: 35%;
    left: 75%;
    width: 0;
    height: 0;
    z-index: 5;
    pointer-events: none;
    filter: url(#gooeyFilter);
  }
  /* --- 左侧螺旋扩散圆点容器 --- */
  .spiral-dots-container-left {
    position: absolute;
    top: 85%;
    left: 30%;
    width: 0;
    height: 0;
    z-index: 1;
    pointer-events: none;
    filter: url(#gooeyFilter);
  }

  /* ============================================================
     融球圆点：拆成 外层(anime 驱动) + 内层(鼠标交互驱动)
     ============================================================ */
  .spiral-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--circle-size);
    height: var(--circle-size);
    margin-left: calc(var(--circle-size) / -2);
    margin-top: calc(var(--circle-size) / -2);
    border-radius: 50%;
    will-change: transform;
    z-index: 1;
  }
  .spiral-dot-core {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background-color: var(--yellow-color);
    opacity: 0.9;
    will-change: transform;
    transform: translate3d(0, 0, 0) scale(1);
    backface-visibility: hidden;
  }

  /* ============================================================
     蒙版圆点：本身不显示黄色，只作为"开洞"的坐标占位
     · 其位置由 JS 每帧读取，写入 .container::before 的 mask
     · 洞口处直接透出最底层的 .bg-image
     ============================================================ */
  .spiral-dot.is-mask-hole .spiral-dot-core {
    background-color: transparent;
    opacity: 0;
  }

  /* --- 毛玻璃音波 --- */
  .audio-wave-container {
    position: absolute;
    top: 50%;
    left: 75%;
    width: 0;
    height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 6;
    transform: translate(-50%, -50%) scale(1.5, 2);
  }
  .audio-bar {
    position: absolute;
    width: 6px;
    height: 1000px;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(8px) saturate(150%);
    -webkit-backdrop-filter: blur(8px) saturate(150%);
    border: 0.5px solid rgba(255, 255, 255, 0.42);

<!-- ============================================================
     Three.js：微妙波浪线背景
     ============================================================ -->
<script>
  (function initWaveBackground() {
    const canvas = document.getElementById('waveCanvas');
    if (!canvas || typeof THREE === 'undefined') return;

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true,
        powerPreference: 'low-power'
      });
    } catch (err) {
      canvas.style.display = 'none';
      return;
    }
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    const FOV = 55;
    const BASE_DIST = 34;
    const SPAN = 74;
    const WAVE_COUNT = 18;
    const SEGMENTS = 160;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.1, 400);
    camera.position.set(0, 0, BASE_DIST);

    const group = new THREE.Group();
    scene.add(group);

    const lines = [];
    const HALF_SPAN_Y = 17;

    for (let i = 0; i < WAVE_COUNT; i++) {
      const positions = new Float32Array((SEGMENTS + 1) * 3);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      const isAccent = (i % 6) === 3;
      const material = new THREE.LineBasicMaterial({
        color: isAccent ? 0xFFDE00 : 0x111111,
        transparent: true,
        opacity: isAccent ? 0.07 : (0.045 + Math.random() * 0.06),
        depthWrite: false,
        blending: THREE.NormalBlending
      });

      const line = new THREE.Line(geometry, material);
      line.frustumCulled = false;
      line.position.z = -4 - Math.random() * 18;

      const t0 = (i + 0.5) / WAVE_COUNT;

      line.userData = {
        positions: positions,
        baseY: (t0 - 0.5) * HALF_SPAN_Y * 2 + (Math.random() - 0.5) * 0.8,
        amp: 0.35 + Math.random() * 1.05,
        freq: 0.75 + Math.random() * 0.65,
        speed: 0.16 + Math.random() * 0.30,
        phase: Math.random() * Math.PI * 2,
        waveA: 0.070 + Math.random() * 0.040,
        waveB: 0.180 + Math.random() * 0.090
      };

      group.add(line);
      lines.push(line);
    }

    function updateLines(t) {
      for (let l = 0; l < lines.length; l++) {
        const line = lines[l];
        const d = line.userData;
        const pos = d.positions;

        for (let i = 0; i <= SEGMENTS; i++) {
          const x = (i / SEGMENTS - 0.5) * SPAN;

          const y =
            Math.sin(x * d.waveA * d.freq + t * d.speed + d.phase) * d.amp +
            Math.sin(x * d.waveB * d.freq - t * d.speed * 1.35 + d.phase * 1.7) * d.amp * 0.45 +
            Math.sin(x * 0.035 + t * 0.14 + d.phase * 0.5) * d.amp * 0.90;

          const k = i * 3;
          pos[k]     = x;
          pos[k + 1] = d.baseY + y;
          pos[k + 2] = 0;
        }

        line.geometry.attributes.position.needsUpdate = true;
      }
    }

    function animateScene(t) {
      updateLines(t);

      group.rotation.z = Math.sin(t * 0.055) * 0.012;
      group.rotation.x = Math.sin(t * 0.040) * 0.018;

      camera.position.x = Math.sin(t * 0.050) * 1.1;
      camera.position.y = Math.cos(t * 0.037) * 0.7;
      camera.lookAt(0, 0, 0);
    }

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);

      camera.aspect = w / h;

      const vH = 2 * Math.tan(THREE.MathUtils.degToRad(FOV / 2)) * BASE_DIST;
      const vW = vH * camera.aspect;
      camera.position.z = vW < SPAN ? BASE_DIST * (SPAN / vW) : BASE_DIST;

      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();

    const clock = new THREE.Clock();
    let rafId = null;

    function loop() {
      rafId = requestAnimationFrame(loop);
      animateScene(clock.getElapsedTime());
      renderer.render(scene, camera);
    }

    if (reduceMotion) {
      animateScene(0);
      renderer.render(scene, camera);
    } else {
      loop();
    }

    document.addEventListener('visibilitychange', function () {
      if (reduceMotion) return;
      if (document.hidden) {
        if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
      } else if (rafId === null) {
        clock.getDelta();
        loop();
      }
    });
  })();
</script>

<!-- ============================================================
     交互脚本（打字机 / 玻璃栏入场 / 融球圆点 / 音波 / 背景联动 / 蒙版洞）
     ============================================================ -->
<script>
  (function() {
    // ----- 配置参数 -----
    const TYPE_SPEED = 100;
    const DELETE_SPEED = 50;
    const PAUSE_AFTER_TYPE = 3000;
    const PAUSE_BETWEEN_CYCLES = 500;

    const line1 = document.getElementById('line1');
    const line2 = document.getElementById('line2');
    const subtitleLine = document.getElementById('subtitleLine');
    const spiralContainer = document.getElementById('spiralContainer');
    const spiralContainerLeft = document.getElementById('spiralContainerLeft');
    const audioWaveContainer = document.getElementById('audioWaveContainer');
    const glassBar = document.getElementById('glassBar');
    const buttons = Array.from(document.querySelectorAll('.nav-btn'));
    const navButtonsContainer = document.getElementById('navButtonsContainer');

    // 背景与光晕节点
    const bgGlow = document.getElementById('bgGlow');
    const containerEl = document.querySelector('.container');

    // 所有融球圆点的内层引用（供鼠标交互 / 质心计算 / 蒙版洞使用）
    const dotCores = [];

    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    /* ============================================================
       玻璃栏入场（仅一次）
       ============================================================ */
    let glassBarVisible = false;
    let glassBarHasEntered = false;

    function glassBarEnter() {
      if (glassBarHasEntered) return;
      glassBarHasEntered = true;
      glassBarVisible = true;

      anime.set(glassBar, { opacity: 0, translateY: 16 });
      anime.set(buttons, { opacity: 0, translateY: 12 });

      anime({
        targets: glassBar,
        opacity: 1,
        translateY: 0,
        duration: 800,
        easing: 'easeOutCubic'
      });

      anime({
        targets: buttons,
        opacity: 1,
        translateY: 0,
        delay: anime.stagger(70, { start: 260 }),
        duration: 800,
        easing: 'easeOutCubic',
        complete: function () {
          updateNavMask();
        }
      });
    }

    function glassBarExit() {
      glassBarVisible = false;
      glassBarHasEntered = false;

      return new Promise(resolve => {
        anime({
          targets: buttons,
          opacity: 0,
          translateY: 10,
          delay: anime.stagger(45, { from: 'last' }),
          duration: 420,
          easing: 'easeInCubic'
        });

        anime({
          targets: glassBar,
          opacity: 0,
          translateY: 14,
          delay: 220,
          duration: 520,
          easing: 'easeInCubic',
          complete: resolve
        });
      });
    }

    /* ============================================================
       横向滚动导航逻辑
       ============================================================ */
    let navScrollTween = null;
    let navIsDragging = false;
    let navStartX = 0;
    let navScrollLeft = 0;
    let navSuppressClick = false;

    function updateNavMask() {
      if (!navButtonsContainer) return;

      const hasOverflow = navButtonsContainer.scrollWidth > navButtonsContainer.clientWidth + 2;

      if (!hasOverflow) {
        navButtonsContainer.classList.remove('has-mask', 'no-left', 'no-right');
        return;
      }

      navButtonsContainer.classList.add('has-mask');

      const atLeft  = navButtonsContainer.scrollLeft <= 1;
      const atRight = navButtonsContainer.scrollLeft + navButtonsContainer.clientWidth >= navButtonsContainer.scrollWidth - 1;

      if (atLeft)  navButtonsContainer.classList.add('no-left');
      else         navButtonsContainer.classList.remove('no-left');

      if (atRight) navButtonsContainer.classList.add('no-right');
      else         navButtonsContainer.classList.remove('no-right');
    }

    function animateNavScrollTo(target) {
      if (!navButtonsContainer) return;
      target = Math.max(0, Math.min(target, navButtonsContainer.scrollWidth - navButtonsContainer.clientWidth));

      const from = navButtonsContainer.scrollLeft;
      if (Math.abs(target - from) < 1) return;

      if (navScrollTween) navScrollTween.pause();

      const proxy = { v: from };
      navScrollTween = anime({
        targets: proxy,
        v: target,
        duration: 460,
        easing: 'cubicBezier(0.4, 0, 0.2, 1)',
        update: function () {
          navButtonsContainer.scrollLeft = proxy.v;
        },
        complete: function () {
          navScrollTween = null;
          updateNavMask();
        }
      });
    }

    function initNavScroller() {
      if (!navButtonsContainer) return;

      navButtonsContainer.addEventListener('wheel', function (e) {
        if (navButtonsContainer.scrollWidth <= navButtonsContainer.clientWidth) return;
        e.preventDefault();

        if (navScrollTween) {
          navScrollTween.pause();
          navScrollTween = null;
        }
        navButtonsContainer.scrollLeft += e.deltaY;
        updateNavMask();
      }, { passive: false });

      function navMouseDown(e) {
        navIsDragging = true;
        navStartX = e.pageX - navButtonsContainer.offsetLeft;
        navScrollLeft = navButtonsContainer.scrollLeft;
        navButtonsContainer.style.cursor = 'grabbing';
        navButtonsContainer.style.userSelect = 'none';
        navSuppressClick = false;
      }
      function navMouseMove(e) {
        if (!navIsDragging) return;
        e.preventDefault();
        const x = e.pageX - navButtonsContainer.offsetLeft;
        const walk = (x - navStartX) * 2;
        if (Math.abs(walk) > 4) navSuppressClick = true;
        navButtonsContainer.scrollLeft = navScrollLeft - walk;
      }
      function navMouseUp() {
        if (!navIsDragging) return;
        navIsDragging = false;
        navButtonsContainer.style.cursor = '';
        navButtonsContainer.style.userSelect = '';
        updateNavMask();
        if (navSuppressClick) {
          setTimeout(function () { navSuppressClick = false; }, 60);
        }
      }

      navButtonsContainer.addEventListener('mousedown', navMouseDown);
      document.addEventListener('mousemove', navMouseMove);
      document.addEventListener('mouseup', navMouseUp);
      navButtonsContainer.addEventListener('mouseleave', navMouseUp);

      navButtonsContainer.addEventListener('touchstart', function (e) {
        const touch = e.touches[0];
        navIsDragging = true;
        navStartX = touch.pageX - navButtonsContainer.offsetLeft;
        navScrollLeft = navButtonsContainer.scrollLeft;
        navSuppressClick = false;
      }, { passive: true });

      navButtonsContainer.addEventListener('touchmove', function (e) {
        if (!navIsDragging) return;
        const touch = e.touches[0];
        const x = touch.pageX - navButtonsContainer.offsetLeft;
        const walk = (x - navStartX) * 2;
        if (Math.abs(walk) > 4) navSuppressClick = true;
        navButtonsContainer.scrollLeft = navScrollLeft - walk;
      }, { passive: true });

      navButtonsContainer.addEventListener('touchend', function () {
        navIsDragging = false;
        updateNavMask();
        if (navSuppressClick) {
          setTimeout(function () { navSuppressClick = false; }, 60);
        }
      });

      navButtonsContainer.addEventListener('click', function (e) {
        if (navSuppressClick) {
          e.preventDefault();
          e.stopPropagation();
          navSuppressClick = false;
        }
      }, true);

      navButtonsContainer.addEventListener('scroll', updateNavMask);
      window.addEventListener('resize', updateNavMask);
    }

    /* ============================================================
       初始化玻璃栏（隐藏 + 涟漪交互）
       ============================================================ */
    function initGlassBar() {
      anime.set(glassBar, { opacity: 0, translateY: 16 });
      anime.set(buttons, { opacity: 0, translateY: 12 });

      buttons.forEach(btn => {
        btn.addEventListener('click', function(e) {
          const ripple = document.createElement('span');
          ripple.style.position = 'absolute';
          ripple.style.width = '20px';
          ripple.style.height = '20px';
          ripple.style.borderRadius = '50%';
          ripple.style.backgroundColor = 'rgba(255, 255, 255, 0.7)';
          ripple.style.pointerEvents = 'none';
          ripple.style.left = (e.offsetX - 10) + 'px';
          ripple.style.top = (e.offsetY - 10) + 'px';
          ripple.style.transform = 'scale(0)';
          ripple.style.opacity = '0.8';
          this.style.position = 'relative';
          this.style.overflow = 'hidden';
          this.appendChild(ripple);

          anime({
            targets: ripple,
            scale: [0, 8],
            opacity: [0.8, 0],
            duration: 800,
            easing: 'easeOutQuad',
            complete: () => {
              if (ripple.parentNode) ripple.remove();
            }
          });
        });
      });
    }

    // ----- 打字机效果 -----
    async function typeWriter(element, text, speed, showCursor = false) {
      element.innerHTML = '';
      if (showCursor) {
        for (let i = 0; i < text.length; i++) {
          element.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
          await sleep(speed);
        }
      } else {
        for (let i = 0; i < text.length; i++) {
          element.innerHTML += text.charAt(i);
          await sleep(speed);
        }
      }
    }

    async function deleteText(element, speed) {
      let text = element.innerHTML;
      while (text.length > 0) {
        if (text.includes('<span class="cursor"></span>')) {
          let textPart = text.replace(/<span class="cursor"><\/span>$/, '');
          textPart = textPart.slice(0, -1);
          element.innerHTML = textPart + '<span class="cursor"></span>';
        } else {
          text = text.slice(0, -1);
          element.innerHTML = text;
        }
        await sleep(speed);
      }
    }

    // ============================================================
    // 打字机 + 玻璃栏 同步演出序列
    // ============================================================
    async function runTypewriterSequence() {
      await sleep(500);

      while (true) {
        glassBarEnter();
        await typeWriter(line1, "DESIGN", TYPE_SPEED);

        await sleep(500);
        await typeWriter(line2, "EVERYDAY.", TYPE_SPEED);

        await sleep(PAUSE_AFTER_TYPE);

        await deleteText(line2, DELETE_SPEED);
        await deleteText(line1, DELETE_SPEED);

        await sleep(PAUSE_BETWEEN_CYCLES);

        await typeWriter(line1, "IGNORE", TYPE_SPEED);

        await sleep(500);
        await typeWriter(line2, "DONE.SPACE", TYPE_SPEED);

        await sleep(PAUSE_AFTER_TYPE);

        await deleteText(line2, DELETE_SPEED);
        await deleteText(line1, DELETE_SPEED);

        await sleep(PAUSE_BETWEEN_CYCLES);
      }
    }

    // ============================================================
    // 【新增】左上角小字打字机（思源黑体）
    // 与主标题保持一致的光标 + 打字/删除节奏，循环播放
    // ============================================================
    async function runSubtitleTypewriter() {
      if (!subtitleLine) return;

      const TEXT = '在这里，展开设计的翅膀';
      const SUB_TYPE_SPEED = 130;     // 单字打出速度
      const SUB_DELETE_SPEED = 55;    // 单字删除速度
      const SUB_HOLD = 2600;          // 打完停留
      const SUB_GAP = 700;            // 删完停顿

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) {
        subtitleLine.textContent = TEXT;
        return;
      }

      await sleep(900);

      while (true) {
        // 打字
        for (let i = 1; i <= TEXT.length; i++) {
          subtitleLine.innerHTML = TEXT.substring(0, i) + '<span class="cursor"></span>';
          await sleep(SUB_TYPE_SPEED);
        }

        await sleep(SUB_HOLD);

        // 删除
        for (let i = TEXT.length - 1; i >= 0; i--) {
          subtitleLine.innerHTML = TEXT.substring(0, i) + '<span class="cursor"></span>';
          await sleep(SUB_DELETE_SPEED);
        }

        await sleep(SUB_GAP);
      }
    }

    // ----- 通用：创建圆点（外层 + 内层） -----
    function createSpiralDot(container, id, side, isMaskHole) {
      const dot = document.createElement('div');
      dot.className = 'spiral-dot';
      dot.id = id;
      if (isMaskHole) dot.classList.add('is-mask-hole');

      const core = document.createElement('div');
      core.className = 'spiral-dot-core';
      if (isMaskHole) {
        core.style.opacity = '0';
        core.style.background = 'transparent';
      }
      dot.appendChild(core);

      container.appendChild(dot);

      dotCores.push({
        parent: dot,
        core: core,
        side: side,
        isMaskHole: !!isMaskHole,
        cx: 0,   // 当前鼠标偏移 X（平滑值）
        cy: 0,   // 当前鼠标偏移 Y（平滑值）
        cs: 1    // 当前缩放（平滑值）
      });
    }

    // ----- 螺旋扩散黄色圆点 (右侧 16 个，索引 2/6/10/14 为蒙版洞) -----
    const MASK_HOLES_RIGHT = [2, 6, 10, 14];
    const MASK_HOLES_LEFT  = [1, 4];

    function initSpiralDotsRight() {
      const DOT_COUNT = 16;
      const angles = Array.from({ length: DOT_COUNT }, (_, i) => i * (360 / DOT_COUNT));
      spiralContainer.innerHTML = '';

      angles.forEach((angle, i) => {
        createSpiralDot(
          spiralContainer,
          `spiralRight${i + 1}`,
          'right',
          MASK_HOLES_RIGHT.indexOf(i) !== -1
        );
      });

      const wanderRangeX = 12;
      const wanderRangeY = 12;
      anime({
        targets: '#spiralContainer',
        translateX: [
          { value: 0, duration: 0 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeX + 'vw', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeX + 'vw', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeX + 'vw', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeX + 'vw', duration: 2000 },
          { value: 0, duration: 2000 }
        ],
        translateY: [
          { value: 0, duration: 0 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeY + 'vh', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeY + 'vh', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeY + 'vh', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeY + 'vh', duration: 2000 },
          { value: 0, duration: 2000 }
        ],
        easing: 'easeInOutSine',
        loop: true,
        duration: 10000
      });

      angles.forEach((angle, i) => {
        const rad = angle * Math.PI / 180;
        const dotId = `#spiralRight${i + 1}`;

        const baseRadius = 420;
        const radiusVariation = 700;
        const randomRadius = baseRadius + (Math.random() * radiusVariation * 2 - radiusVariation);
        const baseDuration = 2200;
        const durationVariation = 1200;
        const randomDuration = baseDuration + (Math.random() * durationVariation * 2 - durationVariation);
        const baseDelay = i * 100;
        const randomExtraDelay = Math.random() * 200;
        const finalDelay = baseDelay + randomExtraDelay;

        const targetX = Math.cos(rad) * randomRadius;
        const targetY = Math.sin(rad) * randomRadius;

        anime({
          targets: dotId,
          translateX: targetX,
          translateY: targetY,
          scale: [0.6, 1.3, 0.6],
          duration: randomDuration,
          delay: finalDelay,
          loop: true,
          direction: 'alternate',
          easing: 'easeInOutSine'
        });
      });
    }

    // ----- 左侧螺旋扩散 (6 个圆点，索引 1/4 为蒙版洞) -----
    function initSpiralDotsLeft() {
      const DOT_COUNT = 6;
      const angles = Array.from({ length: DOT_COUNT }, (_, i) => i * (360 / DOT_COUNT));
      spiralContainerLeft.innerHTML = '';

      angles.forEach((angle, i) => {
        createSpiralDot(
          spiralContainerLeft,
          `spiralLeft${i + 1}`,
          'left',
          MASK_HOLES_LEFT.indexOf(i) !== -1
        );
      });

      const wanderRangeX = 12;
      const wanderRangeY = 12;
      anime({
        targets: '#spiralContainerLeft',
        translateX: [
          { value: 0, duration: 0 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeX + 'vw', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeX + 'vw', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeX + 'vw', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeX + 'vw', duration: 2000 },
          { value: 0, duration: 2000 }
        ],
        translateY: [
          { value: 0, duration: 0 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeY + 'vh', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeY + 'vh', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeY + 'vh', duration: 2000 },
          { value: () => (Math.random() * 2 - 1) * wanderRangeY + 'vh', duration: 2000 },
          { value: 0, duration: 2000 }
        ],
        easing: 'easeInOutSine',
        loop: true,
        duration: 10000
      });

      angles.forEach((angle, i) => {
        const rad = angle * Math.PI / 180;
        const dotId = `#spiralLeft${i + 1}`;

        const baseRadius = 450;
        const radiusVariation = 300;
        const randomRadius = baseRadius + (Math.random() * radiusVariation * 2 - radiusVariation);
        const baseDuration = 2200;
        const durationVariation = 1200;
        const randomDuration = baseDuration + (Math.random() * durationVariation * 2 - durationVariation);
        const baseDelay = i * 130;
        const randomExtraDelay = Math.random() * 200;
        const finalDelay = baseDelay + randomExtraDelay;

        const targetX = Math.cos(rad) * randomRadius;
        const targetY = Math.sin(rad) * randomRadius;

        anime({
          targets: dotId,
          translateX: targetX,
          translateY: targetY,
          scale: [0.6, 1.3, 0.6],
          duration: randomDuration,
          delay: finalDelay,
          loop: true,
          direction: 'alternate',
          easing: 'easeInOutSine'
        });
      });
    }

    // ----- 音波频率视觉效果 (毛玻璃版本) -----
    function initAudioWave() {
      audioWaveContainer.innerHTML = '';

      const BAR_COUNT = 30;
      const BAR_WIDTH = 8;
      const BASE_HEIGHT = 60;
      const MAX_EXTRA_HEIGHT = 60;
      const GAP = 10;

      const totalWidth = BAR_COUNT * (BAR_WIDTH + GAP) - GAP;
      const startX = -totalWidth / 2;

      const bars = [];

      for (let i = 0; i < BAR_COUNT; i++) {
        const bar = document.createElement('div');
        bar.className = 'audio-bar';
        const leftPos = startX + i * (BAR_WIDTH + GAP);
        bar.style.transform = `translateX(${leftPos}px)`;
        bar.style.width = BAR_WIDTH + 'px';
        bar.style.height = BASE_HEIGHT + 'px';
        bar.style.background = 'rgba(255, 255, 255, 0.25)';
        bar.style.backdropFilter = 'blur(8px) saturate(150%)';
        bar.style.webkitBackdropFilter = 'blur(8px) saturate(150%)';
        bar.style.border = '0.5px solid rgba(255, 255, 255, 0.42)';
        bar.style.borderRadius = (BAR_WIDTH / 2) + 'px';
        bar.style.boxShadow = 'inset 0 1px 0 rgba(255, 255, 255, 0.5)';
        bar.dataset.index = i;
        audioWaveContainer.appendChild(bar);
        bars.push(bar);
      }

      bars.forEach((bar, idx) => {
        const centerIndex = (BAR_COUNT - 1) / 2;
        const distanceToCenter = Math.abs(idx - centerIndex) / centerIndex;
        const amplitudeFactor = 1 - distanceToCenter * 0.6;

        const duration = 400 + Math.random() * 800;
        const delay = Math.random() * 400;

        const minHeight = BASE_HEIGHT * 0.6;
        const maxHeight = BASE_HEIGHT + MAX_EXTRA_HEIGHT * amplitudeFactor * (0.6 + Math.random() * 0.5);

        anime({
          targets: bar,
          height: [
            { value: minHeight, duration: 0 },
            { value: maxHeight, duration: duration / 2 },
            { value: minHeight, duration: duration / 2 }
          ],
          scaleX: [
            { value: 0.9, duration: 0 },
            { value: 1.2, duration: duration / 2 },
            { value: 0.9, duration: duration / 2 }
          ],
          duration: duration,
          delay: delay,
          loop: true,
          direction: 'alternate',
          easing: 'easeInOutQuad'
        });
      });
    }

    /* ============================================================
       【核心】圆点交互 + 背景暖光 + 蒙版洞
       ① 背景图片固定不动（方案一：无任何位移）
       ② 黄色圆点被鼠标"推开"（即时响应，独立于 anime 轨道）
       ③ 两组圆点的实时质心驱动背景暖光位置
       ④ 蒙版圆点的实时位置写入 .container::before 的 mask，
          洞口处直接透出最底层的 .bg-image（因 -5 紧贴 -6，中间无夹层）
       ============================================================ */
    function initBackgroundInteraction() {
      if (!bgGlow) return;

      const lerp = (a, b, n) => a + (b - a) * n;

      // 指针状态（目标值 + 平滑值）
      const pointer = {
        tx: window.innerWidth / 2,
        ty: window.innerHeight / 2,
        x: window.innerWidth / 2,
        y: window.innerHeight / 2,
        active: false
      };

      window.addEventListener('mousemove', function (e) {
        pointer.tx = e.clientX;
        pointer.ty = e.clientY;
        pointer.active = true;
      }, { passive: true });

      window.addEventListener('mouseleave', function () {
        pointer.active = false;
      });

      window.addEventListener('touchmove', function (e) {
        if (!e.touches.length) return;
        const t = e.touches[0];
        pointer.tx = t.clientX;
        pointer.ty = t.clientY;
        pointer.active = true;
      }, { passive: true });

      window.addEventListener('touchend', function () {
        pointer.active = false;
      }, { passive: true });

      // 鼠标排斥参数
      const REPEL_RADIUS = 300;      // 影响半径
      const REPEL_STRENGTH = 55;     // 最大位移 px
      const REPEL_SCALE = 0.5;       // 最大额外缩放

      // 收集蒙版洞圆点的索引（在 dotCores 中的位置）
      const maskHoleIndexes = [];
      for (let i = 0; i < dotCores.length; i++) {
        if (dotCores[i].isMaskHole) maskHoleIndexes.push(i);
      }

      let lastMaskValue = '';

      /* 把蒙版洞的实时位置写进 CSS 变量，交由 .container::before 的 mask 使用 */
      function updateMaskHoles(rects) {
        if (!containerEl || maskHoleIndexes.length === 0) return;

        const parts = [];
        for (let k = 0; k < maskHoleIndexes.length; k++) {
          const rect = rects[maskHoleIndexes[k]];
          if (!rect || rect.width <= 0) continue;

          const cx = rect.left + rect.width * 0.5;
          const cy = rect.top + rect.height * 0.5;
          const rad = rect.width * 0.5;

          parts.push(
            'radial-gradient(circle at ' +
            cx.toFixed(1) + 'px ' + cy.toFixed(1) + 'px, ' +
            'rgba(0,0,0,0) 0px, ' +
            'rgba(0,0,0,0) ' + rad.toFixed(1) + 'px, ' +
            '#000 ' + (rad + 1).toFixed(1) + 'px)'
          );
        }

        const value = parts.length ? parts.join(', ') : 'none';
        if (value !== lastMaskValue) {
          lastMaskValue = value;
          containerEl.style.setProperty('--mask-holes', value);
        }
      }

      function frame() {
        /* ---- 1. 批量读取布局（避免读写交错导致反复强制重排） ---- */
        const rects = new Array(dotCores.length);
        for (let i = 0; i < dotCores.length; i++) {
          rects[i] = dotCores[i].parent.getBoundingClientRect();
        }

        /* ---- 2. 指针平滑 ---- */
        pointer.x = lerp(pointer.x, pointer.tx, 0.10);
        pointer.y = lerp(pointer.y, pointer.ty, 0.10);

        /* ---- 3. 圆点交互 + 质心统计 ---- */
        let rSumX = 0, rSumY = 0, rN = 0;
        let lSumX = 0, lSumY = 0, lN = 0;

        for (let i = 0; i < dotCores.length; i++) {
          const item = dotCores[i];
          const rect = rects[i];
          const cx = rect.left + rect.width * 0.5;
          const cy = rect.top + rect.height * 0.5;

          // 质心累加（蒙版洞同样参与，暖光位置与整簇圆点一致）
          if (item.side === 'right') { rSumX += cx; rSumY += cy; rN++; }
          else                        { lSumX += cx; lSumY += cy; lN++; }

          // 蒙版洞本身不可见，跳过鼠标排斥与缩放
          if (item.isMaskHole) continue;

          let targetOffsetX = 0;
          let targetOffsetY = 0;
          let targetScale = 1;

          if (pointer.active) {
            const dx = cx - pointer.x;
            const dy = cy - pointer.y;
            const dist = Math.sqrt(dx * dx + dy * dy) || 0.001;

            if (dist < REPEL_RADIUS) {
              const f = 1 - dist / REPEL_RADIUS;
              // smoothstep 缓动，让靠近时推力更自然
              const ease = f * f * (3 - 2 * f);
              targetOffsetX = (dx / dist) * ease * REPEL_STRENGTH;
              targetOffsetY = (dy / dist) * ease * REPEL_STRENGTH;
              targetScale = 1 + ease * REPEL_SCALE;
            }
          }

          item.cx = lerp(item.cx, targetOffsetX, 0.18);
          item.cy = lerp(item.cy, targetOffsetY, 0.18);
          item.cs = lerp(item.cs, targetScale, 0.18);

          item.core.style.transform =
            'translate3d(' + item.cx.toFixed(2) + 'px, ' +
            item.cy.toFixed(2) + 'px, 0) scale(' + item.cs.toFixed(3) + ')';
        }

        /* ---- 4. 用圆点质心驱动背景暖光 ---- */
        if (rN > 0) {
          bgGlow.style.setProperty('--glow-right-x', (rSumX / rN).toFixed(1) + 'px');
          bgGlow.style.setProperty('--glow-right-y', (rSumY / rN).toFixed(1) + 'px');
        }
        if (lN > 0) {
          bgGlow.style.setProperty('--glow-left-x', (lSumX / lN).toFixed(1) + 'px');
          bgGlow.style.setProperty('--glow-left-y', (lSumY / lN).toFixed(1) + 'px');
        }

        /* ---- 5. 更新蒙版洞（透出最底层的 .bg-image） ---- */
        updateMaskHoles(rects);

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    }

    // 初始化所有
    window.onload = () => {
      initGlassBar();
      initNavScroller();
      initSpiralDotsRight();
      initSpiralDotsLeft();
      initAudioWave();
      initBackgroundInteraction();   // 背景固定 + 波点交互 + 蒙版洞
      runTypewriterSequence();
      runSubtitleTypewriter();       // 左上角小字打字机
    };
  })();
</script>

<!-- 自定义光标 HTML：放在 footer 前或 body 最后 -->
<div id="custom-cursor" class="custom-cursor"></div>

<style>
  /* 默认隐藏系统光标（桌面端） */
  @media (pointer: fine) {
    *:not(input):not(textarea):not(.custom-cursor),
    *:not(input):not(textarea):not(.custom-cursor)::before,
    *:not(input):not(textarea):not(.custom-cursor)::after {
      cursor: none !important;
    }

    #custom-cursor {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      background-color: #E3E3E3;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: background-color 0.3s ease, transform 0.2s ease;
      z-index: 999999;
      opacity: 1;
      mix-blend-mode: normal;
    }

    #custom-cursor.active {
      transform: translate(-50%, -50%) scale(0.8);
      background-color: #999;
    }
  }

  /* 移动端隐藏自定义光标 */
  @media (pointer: coarse) {
    #custom-cursor {
      display: none !important;
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // 检查是否是桌面端（pointer: fine）
    const isDesktop = window.matchMedia("(pointer: fine)").matches;
    if (!isDesktop) return;

    const cursor = document.getElementById("custom-cursor");
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    if (cursor) {
      cursor.style.left = mouseX + "px";
      cursor.style.top = mouseY + "px";

      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        cursor.style.left = mouseX + "px";
        cursor.style.top = mouseY + "px";
      });

      document.addEventListener("mousedown", () => {
        cursor.classList.add("active");
      });

      document.addEventListener("mouseup", () => {
        cursor.classList.remove("active");
      });
    }
  });
</script>

<!-- 回到顶部按钮 -->
<style>
  #back-to-top {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 40px;
    height: 40px;
    background-color: #fff;
    border-radius: 50%;
    cursor: pointer;
    z-index: 9999;
    display: none;
    transition: all 0.3s ease;
    padding: 10px;
  }

  #back-to-top img {
    width: 100%;
    height: 100%;
    filter: invert(0); /* 黑色箭头 */
    transition: filter 0.3s ease;
  }

  #back-to-top:hover {
    background-color: #000;
  }

  #back-to-top:hover img {
    filter: invert(1); /* 白色箭头 */
  }

  @media screen and (max-width: 768px) {

<script>
  const startTime = Date.now(); // 记录启动时间

  document.addEventListener("DOMContentLoaded", () => {
    const preloader = document.getElementById("preloader");

    // 只在首页执行启动页动画，判断条件：
    // 严格等于 https://www.ignoredone.space/ （末尾带斜杠）
    if (window.location.href === "https://www.ignoredone.space/") {
      // 显示启动页
      preloader.style.display = "flex";

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;

      // 监听鼠标移动，更新圆形蒙版的位置
      document.addEventListener("mousemove", (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      });

      window.addEventListener("load", () => {
        const elapsed = Date.now() - startTime;
        const minDuration = 500; // 启动页最短显示时间（ms）
        const delay = elapsed < minDuration ? (minDuration - elapsed) : 0;

        setTimeout(() => {
          preloader.style.transition = "clip-path 1s ease";
          preloader.style.clipPath = `circle(0px at ${mouseX}px ${mouseY}px)`;

          // 动画结束后隐藏启动页容器
          preloader.addEventListener("transitionend", () => {
            preloader.style.display = "none";
          }, { once: true });
        }, delay);
      });
    } else {
      // 非首页隐藏启动页，避免影响页面
      preloader.style.display = "none";
    }
  });
</script>
<script>
document.addEventListener('click', function(e){

    const link = e.target.closest('a');
    if(!link) return;

    const href = link.href || '';

    // 需要下载的文件类型
    const downloadTypes = [
        '.apk',
        '.zip',
        '.rar',
        '.7z',
        '.pdf',
        '.dmg',
        '.exe'
    ];

    const isDownload = downloadTypes.some(type =>
        href.toLowerCase().includes(type)
    );

    if(!isDownload) return;

    e.preventDefault();

    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = href;

    document.body.appendChild(iframe);

    setTimeout(()=>{
        iframe.remove();
    },5000);

});
</script>
