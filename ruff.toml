# Ruff 配置 —— 本轮由用户点头「装进 venv」落地（动作 id `ruff-yes`）。
#
# 装法：.venv/Scripts/python.exe -m pip install -r requirements-dev.txt
# 跑法（两条都要跑，含义不同）：
#   .venv/Scripts/ruff.exe check .        # 找问题（不改文件）
#   .venv/Scripts/ruff.exe format .       # 排版（改文件）
#   .venv/Scripts/ruff.exe format --check --diff .   # 只报不改，给 CI/交差用
#
# ── 这一版刻意只做「装闸 + 现状登记」，不动任何既有文件 ──
# 摸底读数（2026-11-05 23:5x，本机 ruff 0.17.3，默认规则集，命令原文）：
#   ruff check --statistics .   → Found 1272 errors（567 fixable with --fix）
#   ruff format --diff .        → 288 files would be reformatted, 68 already formatted
#   锁定面上的违规条数：bili_scribe 755 / video_workbench/core/summary 131 /
#                       video_workbench/infra/notecache.py 0
# ⇒ 一次性 --fix 或全量 format 会在发版中途造出几百个文件的 diff，还会撞正在被
#   别人改的 `video_workbench/app/jobs.py` 与 parity 名下测试。所以本文件把范围
#   钉到「产品码 + 常驻测试」，历史债另开单还；不在此文件里假装已清。

line-length = 100
# 最低运行时是 Python 3.10（README.md 写「需要 Python 3.10+」，仓库里没有 pyproject
# 声明，那就以 README 为准）。这里**不能**写 py314：本机 venv 是 3.14，写成 py314 时
# `ruff format` 会把 `except (A, B):` 改写成 PEP 758 的 `except A, B:`——
# 那是 3.14 才合法的语法，3.10–3.13 上直接 SyntaxError。
# 实测（2026-11-06）：py314 下 `ruff format --check --diff video_workbench` 的
# diff 里有 15+ 处 `+ except TypeError, ValueError:`；改成 py310 后同样的命令
# 一处都不再出现。
target-version = "py310"

# 默认只开「错到会影响正确性」的一族。每加一族都要先跑一次看新增多少条，
# 不许一次选 `select = ["ALL"]`——那等于把 1272 条直接变成永久红灯。
select = [
  "E4",   # import 位置/数量
  "E7",   # 明显的语句问题（裸 except 之外的可分性）
  "E9",   # 语法错误
  "F",    # pyflakes：未用导入、未定义名、重复定义
  "I001", # import 排序（可自动修，diff 局限在头部）
  "UP032",# f-string 替代 .format（低风险）
]

[lint]
extend-safe-fixes = ["I001", "UP032", "F401"]

# 锁定面必须在这里再写一遍：ruff 的 lint 与 format 有两套独立的 exclude 名单，
# 顶层的 exclude 只落到 formatter.exclude（实测见文件头那段读数）。
# 注意字段名：0.17.3 的 [lint] 只认 exclude，不认 extend-exclude（写错会直接报
# unknown field 并让所有 ruff 命令 rc=1）。
exclude = [
  # 逐字节对齐 bili_scribe 的五份 .py 与六个真源 txt —— 改一个字节就是漂移。
  "video_workbench/core/summary/roles.py",
  "video_workbench/core/summary/summarizer.py",
  "video_workbench/core/summary/__init__.py",
  "video_workbench/core/prompt_source.py",
  "video_workbench/infra/notecache.py",
  "video_workbench/resources/prompts",
  # 参考侧本体：本会话硬边界「禁改 bili_scribe/**」。
  "bili_scribe",
  # 发布镜像检出与打包中间产物（不是本仓源码）。
  "build",
  "dist",
  ".venv",
  "__pycache__",
  ".pytest_cache",
  "node_modules",
]

[format]
# 与 lint 同一族范围；quote-style 保持默认双引号，避免对既有中文注释重排造成无意义 diff。
docstring-code-format = false

# ── exclude：三类东西，理由各不同，不许合并成一条通配 ──
#
# ⚠️ 这份清单必须**同时**出现在 [format] 与 [lint] 两节（见下面 [lint] exclude）。
# 2026-11-06 实测：只写在顶层/只写在 [format] 时，ruff check 根本不看它——
#   ruff check --show-settings video_workbench  → linter.exclude = []
#   ruff check --show-files video_workbench     → 列出 core/summary/roles.py 等四份锁定文件
#   ruff check --select F401,I001 --fix --diff  → diff 头就是 roles.py 与 summarizer.py
# 也就是说：任何一次 check --fix 都会改锁定面字节，撞 drift 闸与打包期字节比对。
# 两处清单由 tests/wb 的 lint 闸对账（见 task-71 的验收），不许只改一处。
exclude = [
  # (1) 参考侧原样 vendored 的源码：逐字节对齐 bili_scribe，改了就是漂移。
  #     这份清单现读自 tests/wb/test_git_no_normalization_on_locked_paths.py 的
  #     PY_LOCK_FLOOR + drift 闸的 Path 常量（实测 5 个 .py + 6 个 txt）。
  "video_workbench/core/summary/roles.py",
  "video_workbench/core/summary/summarizer.py",
  "video_workbench/core/summary/__init__.py",
  "video_workbench/core/prompt_source.py",
  "video_workbench/infra/notecache.py",
  "video_workbench/resources/prompts",
  # (2) 参考侧本体：本会话硬边界「禁改 bili_scribe/**」，它 755 条违规与本次无关。
  "bili_scribe",
  # (3) 发布镜像的检出与打包中间产物（不是本仓源码）。
  "build",
  "dist",
  ".venv",
  "__pycache__",
  ".pytest_cache",
  "node_modules",
]

# ── 历史遗留的一次性脚本：今天还跟踪在库里，但它们该被删掉，不该被"格式化"。
#     写成逐文件 lint-per-file-ignores（而不是通配），文件真删了以后 `ruff check`
#     会报 E902 找不到路径 —— 那就是提醒回来清这份名单的牙。
[lint.per-file-ignores]
"dump_sub*.py" = ["ALL"]
"_conv_doc.ps1" = ["ALL"]
"_extract_docx.py" = ["ALL"]
"_match_tiku.py" = ["ALL"]
"_parse_tiku.py" = ["ALL"]
"_search_tiku.py" = ["ALL"]
"db_stats.py" = ["ALL"]
"db_task.py" = ["ALL"]
"diff_stats.py" = ["ALL"]
"fetch_task.py" = ["ALL"]
"poll2.py" = ["ALL"]
"poll_task.py" = ["ALL"]
"refine-*.py" = ["ALL"]
