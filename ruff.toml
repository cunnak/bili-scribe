# Ruff 配置 —— bili-scribe
#
# 跑法：
#   .venv/Scripts/ruff.exe check bili_scribe tests scripts run.py
#   .venv/Scripts/ruff.exe format --check --diff bili_scribe tests scripts run.py
#
# 验收时显式传路径，不依赖全仓扫描；这样历史产物与本地旧产品副本不会被误扫。

line-length = 100
target-version = "py310"

# 本地旧产品副本只留磁盘，不参与 BiliScribe 验收扫描
exclude = [
  ".venv",
  "build",
  "dist",
  "Temp",
  "docs/screenshots",
  "_tmp_imgs",
  "tests/w?",
  "scripts/accept_*.py",
  "scripts/backfill_collection_index.py",
  "scripts/bench_*.py",
  "scripts/build_wb.py",
  "scripts/check_colors.py",
  "scripts/dirty_report.py",
  "scripts/make_wb_icon.py",
  "scripts/p502_child.py",
  "scripts/probe_frozen_naming.py",
  "scripts/shoot_wb.py",
  "scripts/sync_mirror*.py",
  "scripts/verify_cover_fix.py",
  "scripts/verify_manual.py"
]

[lint]
select = ["E4", "E7", "E9", "F"]

[format]
exclude = [
  ".venv",
  "build",
  "dist",
  "Temp",
  "docs/screenshots",
  "_tmp_imgs"
]